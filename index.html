.dban-body{flex:1;min-width:0}
.dban-who{font-size:10.5px;color:var(--ink3);margin-bottom:2px}
.dban-what{font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dban-go{color:var(--accent);font-size:16px;flex:none}
.ddesk-deco{display:flex;justify-content:center;gap:22px;margin-top:auto;padding:16px 0 6px;font-size:20px;filter:saturate(.8);opacity:.85}
.dhint{text-align:center;font-size:11px;color:var(--ink2);opacity:.75;padding:4px 0 calc(14px + env(safe-area-inset-bottom))}
.back{cursor:pointer;padding:0 8px}
</style>

+ '<div class="dban-body"><div class="dban-who">' + (mode === 'pending' ? '新消息' : '处理中')
+ ' · ' + esc(app.label) + (who ? ' · ' + esc(who) : '') + '</div>'
+ '<div class="dban-what">' + what + '</div></div>'
+ '<div class="dban-go">▸</div></div>';
}
function desktopHTML() {
const view = DESK.view, mode = DESK.mode, app = appOf(view);
const icons = APPS.map((a) => {
const isPend = a.key === app.key;
const lockedTool = a.key === 'tool' && (!S || S.toolStage < 1);
return '<div class="dicon' + (isPend ? ' hot' : '') + (lockedTool ? ' dim' : '') + '" data-act="deskapp" data-k="' + a.key + '">'
+ '<div class="dico">' + a.glyph + (isPend && mode === 'pending' ? '<i class="badge"></i>' : '') + '</div>'
+ '<div class="dlabel">' + a.label + '</div></div>';
}).join('');
const mini = Object.keys(PACK.metrics).map((k) => {
const m = S.metrics[k];
return '<div class="dmetric"><span>' + esc(PACK.metrics[k].label) + '</span>'
+ '<i class="' + (m < 35 ? 'x' : m < 50 ? 'w' : 'on') + '" style="width:' + m + '%"></i></div>';
}).join('');
return '<div class="desktop">'
+ '<div class="dstatus"><span class="dclock">' + esc(view.clock) + '</span><span>' + esc(PACK.meta.date || '') + '</span><span class="dnet">5G ▮▮▮▯</span></div>'
+ '<div class="dmetrics">' + mini + '</div>'
+ '<div class="dgrid">' + icons + '</div>'
+ deskBanner(view, mode)
+ '<div class="ddesk-deco"><span>🌱</span><span>🏆</span><span>☕</span><span>🖼️</span></div>'
+ '<div class="dhint">' + (mode === 'pending' ? '有人来找你了——点上面的横幅，或点闪动的图标。' : '这件事还没处理完——点横幅回去继续。') + '</div>'
+ '</div>';
}
function renderDesk(view, mode) {
VIEW = view;
DESK = { view, mode };
$('#app').innerHTML = desktopHTML();
renderDrawer();
renderTeach();
window.scrollTo(0, 0);
}
let LAST_SETTLE = null;
function reportHTML(view) {
const st = DNE.settle(S, PACK);
LAST_SETTLE = st;
const dimRows = st.dims.map((d) => {
let h = '';
for (let i = 0; i < 5; i++) h += '<i class="' + (i < d.segs ? 'on' : '') + '"></i>';
return '<div class="dline"><span class="dk">' + esc(d.label) + '</span><span class="dbar">' + h + '</span><span class="dband">' + esc(d.band) + '</span></div>';
}).join('');
const moments = st.moments.map((m) => '<div class="mline"><b>' + esc(m.clock) + '</b> ' + esc(m.text) + (m.lesson ? '<br><span class="mut">' + esc(m.lesson) + '</span>' : '') + '</div>').join('')
|| '<div class="mut">本局没有触发对照时刻。</div>';
return '<div class="appbar"><span class="ttl" style="margin:0 auto">' + esc(view.title) + '</span></div><div class="pad report">'
+ view.body.map(blockHTML).join('')
+ '<div class="rwho">小连 · 采购部 · 入职 3 个月<br>' + esc(PACK.meta.packVersion) + ' · ' + esc(S.runId) + '</div>'
+ '<h4>你的五个维度</h4>' + dimRows
+ '<div class="verdict"><div class="vn">' + esc(st.portrait.name) + ' · ' + esc(st.styleTag) + '</div><div class="vq">“' + esc(st.portrait.line) + '”</div></div>'
+ (st.overdone.length ? '<div class="sysbar warn">⚠ 过犹不及：' + esc(st.overdone.join('、')) + ' 拉得太满——单项最优不是全局最优。</div>' : '')
+ '<h4>三个关键时刻</h4>' + moments
+ '<h4>如果再给一次机会，你会改哪个决定？</h4>'
+ '<textarea id="reflect" class="ta" rows="3" placeholder="必须写一句。指向具体的决定，比如“我会改 10:42，因为我没算账期成本”。">' + esc(S.probe.reflection || '') + '</textarea>'
+ '<h4>建议</h4><div class="para">' + esc(st.advice) + '</div>'
+ '<div class="btnrow"><button class="cbtn" data-act="copy">复制采购日志</button>'
+ '<button class="cbtn gh" data-act="download">下载 .txt</button>'
+ '<button class="cbtn gh" data-act="restart">再玩一次</button></div>'
+ '<div class="mut" style="text-align:center;margin:10px 0 20px">' + esc(PACK.meta.credit) + '</div>'
+ '</div>';
}
function render(view) {
VIEW = view;
if (EXPAND_NODE !== view.id) { EXPANDED = false; EXPAND_NODE = view.id; }
const echoBars = view.echoes && view.echoes.length
? '<div class="banner" style="background:var(--accent-soft);border-color:#d7e2ec;color:#2f4c62">'
+ view.echoes.map((e) => '↩ ' + esc(e.causeText)).join('<br>') + '</div>' : '';
const memBar = MEM_ONLY ? '<div class="banner">本次进度不保存（浏览器存储不可用），请立即导出</div>' : '';
const teachBar = TEACH && view.kind !== 'probe' && view.kind !== 'report'
? (() => {
const node = PACK.nodes.find((n) => n.id === view.id);
if (!node || !node.teach) return '';
return '<div class="banner teachbar">📖 教学点：' + esc((node.teach.concept || []).join('、'))
+ (node.teach.ref ? ' ｜ ' + esc(node.teach.ref) : '') + '</div>';
})() : '';
const needCut = collapsed(view);
let main = '';
if (view.kind === 'probe') main = probeHTML(view);
else if (view.kind === 'report') main = reportHTML(view);
else {
let bodyView = view;
let expandBar = '';
if (needCut) {
bodyView = Object.assign({}, view, { body: view.body.slice(0, 2) });
expandBar = '<div class="pad"><div class="expandbar" data-act="expand">展开全文（还有 ' + (view.body.length - 2) + ' 段）▼</div></div>';
}
main = bodyHTML(bodyView) + expandBar + choicesHTML(view, needCut);
}
$('#app').classList.toggle('probemode', view.kind === 'probe');
$('#app').innerHTML = memBar + hudHTML() + echoBars + teachBar + main + footHTML();
renderDrawer();
renderTeach();
window.scrollTo(0, 0);
}
function renderDrawer() {
let d = $('#drawerWrap');
if (!d) {
d = document.createElement('div');
d.id = 'drawerWrap';
document.body.appendChild(d);
}
d.innerHTML = TOOL_OPEN ? toolHTML() : '';
}
let toastTimer = null;
function toast(lines) {
const el = $('#toast');
el.textContent = lines.join('\n');
el.classList.add('show');
clearTimeout(toastTimer);
toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
function metricToasts(choice) {
const lines = [];
(choice.effects || []).forEach((e) => {
if (e.op !== 'metric') return;
const label = PACK.metrics[e.key] ? PACK.metrics[e.key].label : e.key;
lines.push(label + '：' + (e.delta > 0 ? '好转' : e.delta < 0 ? '承压' : '持平') + '（' + DNE.BAND(S.metrics[e.key]) + '）');
});
if (lines.length) toast(lines);
}
function saveKey() { return 'dne:' + PACK.meta.packId + ':run'; }
function persist() {
try { localStorage.setItem(saveKey(), JSON.stringify(S)); MEM_ONLY = false; }
catch (e) { MEM_ONLY = true; }
}
function loadSave() {
try {
const raw = localStorage.getItem(saveKey());
if (!raw) return null;
const s = JSON.parse(raw);
if (!s || s.packId !== PACK.meta.packId) return null;
if (s.stateVersion !== 1) { SAVE_STALE = true; return null; } // 旧档不静默丢弃，明示玩家
return s;
} catch (e) { return null; }
}
function clearSave() { try { localStorage.removeItem(saveKey()); } catch (e) {} }
function stageHTML() {
const hasSave = !!loadSave();
const btns = hasSave
? '<button class="cbtn" data-act="continue">继续（从 ' + esc(DNE.fmtClock(loadSave().clock)) + ' 接着玩）</button><button class="cbtn gh" data-act="start">重新开始</button>'
: '<button class="cbtn" data-act="start">开始新的一天</button>';
$('#app').innerHTML = '<div class="stage"><div class="brand">DAKASHI · PURCHASING</div>'
+ '<h1>' + esc(PACK.meta.title) + '</h1><div class="sub">' + esc(PACK.meta.subtitle) + '</div>'
+ '<div class="meta2">剧情决策 · 单局约 ' + esc(PACK.meta.minutes) + ' 分钟 · 竖屏体验<br>'
+ '<span data-act="teachon" style="padding:4px 8px">' + esc(PACK.meta.packVersion) + ' · build ' + BUILD + '</span></div>'
+ btns
+ (TEACH ? '<button class="cbtn" data-act="teach" style="margin-top:10px">👨‍🏫 教师面板</button>' : '')
+ (SAVE_STALE ? '<div class="endtag">检测到旧版本存档，与本版不兼容，已为你开新的一天（旧档仍在，不会静默丢弃）。</div>' : '')
+ '<div class="endtag">凭直觉选，别猜标准答案——这游戏没有标准答案。<br>进度自动保存，可以随时退出。</div>'
+ '<div class="meta2" style="margin-top:18px">' + esc(PACK.meta.credit) + '</div></div>';
renderDrawer();
renderTeach();
}
function endHTML(red) {
const rl = (PACK.redlines || []).find((r) => r.id === red);
$('#app').innerHTML = '<div class="stage"><div class="brand">ENDING</div><h1>踩线者</h1>'
+ '<div class="sub">' + esc(rl ? rl.label : red) + '</div>'
+ '<div class="endtag">审计在三个月后找到了那张单。<br>（红线结局：' + esc(red) + '）</div>'
+ '<button class="cbtn" data-act="restart">重新开始</button></div>';
clearSave();
renderDrawer();
}
function bootHTML() {
return '<div class="boot">'
+ '<div class="bootwall"><div class="bootdate">' + esc(PACK.meta.date || '') + ' · 09:00</div>'
+ '<div class="boothello">你的工位</div></div>'
+ '<div class="desk">'
+ '<div class="monitor"><div class="mscreen"><div class="scrbrand">DAKASHI</div>'
+ '<div class="scrsub">' + esc(PACK.meta.subtitle) + '</div>'
+ '<button class="pwr" data-act="boot">▶ 按下电源键，开始这一天</button></div>'
+ '<div class="mstand"></div></div>'
+ '<div class="stickynote">今天：<br>CM-3200 加热管要下单<br>17:00 前交日报</div>'
+ '<div class="notebook">采购实务 · 笔记</div>'
+ '<div class="mug"></div>'
+ '</div>'
+ '<div class="boottip">电脑里有一天的邮件和消息在等你。</div></div>';
}
function showBoot() {
$('#app').innerHTML = bootHTML();
renderDrawer();
renderTeach();
window.scrollTo(0, 0);
}
function reportText() {
const st = LAST_SETTLE || DNE.settle(S, PACK);
return DNE.buildReportText(S, PACK, st);
}
function doCopy() {
const t = reportText();
const done = () => toast(['已复制，粘贴交给老师即可']);
if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done));
else fallbackCopy(t, done);
}
function fallbackCopy(t, done) {
const ta = document.createElement('textarea');
ta.value = t; document.body.appendChild(ta); ta.select();
try { document.execCommand('copy'); done(); } catch (e) { toast(['复制失败，请用下载']); }
document.body.removeChild(ta);
}
function doDownload() {
const t = reportText();
const blob = new Blob([t], { type: 'text/plain;charset=utf-8' });
const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = '采购日志-' + S.runId + '.txt';
document.body.appendChild(a); a.click(); document.body.removeChild(a);
setTimeout(() => URL.revokeObjectURL(a.href), 2000);
toast(['已下载 .txt']);
}
document.addEventListener('click', (ev) => {
const el = ev.target.closest('[data-act]');
if (!el) return;
const act = el.getAttribute('data-act');
if (act === 'start' || act === 'restart') {
clearSave();
TOOL_OPEN = false;
S = DNE.initState(PACK);
persist();
showBoot(); // 先进工位开机画面，按下电源键再进 09:00
} else if (act === 'boot') {
const r = DNE.enterNode(S, PACK, PACK.start);
S = r.S; persist(); renderDesk(r.view, 'pending'); // 开机先进桌面：便签在闪
} else if (act === 'deskopen') {
render(VIEW); // 点开横幅/图标 → 进入当前 App 全屏
} else if (act === 'deskapp') {
if (el.getAttribute('data-k') === appOf(VIEW).key) render(VIEW);
else toast(['这个 App 暂时没有新消息']);
} else if (act === 'deskback') {
renderDesk(VIEW, 'current');
} else if (act === 'continue') {
const saved = loadSave();
if (!saved) return;
S = saved; toolInit();
const r = DNE.enterNode(S, PACK, S.cursor.nodeId);
S = r.S; render(r.view);
} else if (act === 'choice') {
if (!EXPANDED && collapsed(VIEW)) S.counters.unexpanded = (S.counters.unexpanded || 0) + 1;
const r = DNE.choose(S, PACK, VIEW, el.getAttribute('data-id'));
if (r.blocked) return;
const choice = VIEW.choices.find((c) => c.id === el.getAttribute('data-id'));
S = r.S;
if (choice) metricToasts(choice);
if (S.redline) { endHTML(S.redline); return; }
if (S._restart) { S._restart = false; clearSave(); stageHTML(); return; }
persist(); renderDesk(r.view, 'pending'); // 处理完一件事 → 回桌面，下一条消息在等
} else if (act === 'probe') {
const r = DNE.answerProbe(S, PACK, VIEW, +el.getAttribute('data-i'), +el.getAttribute('data-v'));
S = r.S;
if (r.done) { persist(); renderDesk(r.view, 'pending'); }
else { persist(); render(VIEW); }
} else if (act === 'tool') {
TOOL_OPEN = !TOOL_OPEN;
renderDrawer();
} else if (act === 'assump') {
toolInit();
const k = el.getAttribute('data-k'), f = el.getAttribute('data-f'), v = el.getAttribute('data-v') === '1';
S.tool[k][f] = S.tool[k][f] === v ? null : v;
persist(); renderDrawer();
} else if (act === 'toolcalc') {
document.querySelectorAll('#drawerWrap .tin').forEach((inp) => {
const k = inp.getAttribute('data-k'), f = inp.getAttribute('data-f');
const val = inp.value.trim() === '' ? null : Math.max(0, parseInt(inp.value, 10) || 0);
S.tool[k][f] = val;
});
TOOL_OPEN = true; persist();
const before = S.toolUses.length;
renderDrawer();
const calc = toolCompute();
if (S.toolUses.length > before) {
const last = S.toolUses[S.toolUses.length - 1];
toast(last.correct ? ['排序正确：' + last.ranks.join(' < ')] : ['算完了，但排序值得怀疑——核对口径']);
}
} else if (act === 'expand') {
EXPANDED = true; render(VIEW);
} else if (act === 'teachon') {
teachTaps++;
if (teachTaps >= 5 && !TEACH) { TEACH = true; stageHTML(); toast(['教师模式已开启']); }
} else if (act === 'teach') {
TEACH_OPEN = !TEACH_OPEN; renderTeach();
} else if (act === 'teachsim') {
TEACH_SIM = DNE.simulate(PACK, 50); renderTeach();
} else if (act === 'teachjump') {
const sel = $('#tjump');
if (!sel || !S) return;
TEACH_OPEN = false;
const r2 = DNE.jumpTo(S, PACK, sel.value);
S = r2.S; persist(); render(r2.view);
} else if (act === 'teachclear') {
clearSave(); TEACH_SIM = null; stageHTML(); toast(['本机存档已清除']);
} else if (act === 'copy') { doCopy(); }
else if (act === 'download') { doDownload(); }
}, false);
document.addEventListener('input', (ev) => {
if (ev.target && ev.target.id === 'reflect') { S.probe.reflection = ev.target.value; persist(); }
}, false);
DNE.boot = function () {
const PKEY = 'dne' + '-' + 'cg' + '2026';
try {
const px = document.getElementById('packx');
PACK = DNE.parsePack(px ? DNE.unpack(px.textContent, PKEY) : document.getElementById('pack').textContent);
}
catch (e) {
$('#app').innerHTML = '<div class="stage"><h1>剧本读取失败</h1><div class="sub" style="white-space:pre-wrap">' + esc(e.message) + '</div></div>';
return;
}
const v = DNE.validate(PACK);
v.errs.forEach((e) => console.error('[体检]', e));
v.warns.forEach((w) => console.warn('[体检]', w));
if (v.errs.length) {
$('#app').innerHTML = '<div class="stage"><h1>体检未通过</h1><div class="sub">' + esc(v.errs.join('；')) + '</div></div>';
return;
}
stageHTML();
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', DNE.boot);
else DNE.boot();
})();
</script>
</body>
</html>
